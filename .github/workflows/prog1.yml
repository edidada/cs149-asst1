name: CS149 Program 1 threads
on:
  push:
    branches: [edidada/prog1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and compare original serial output
        run: |
          set -euo pipefail
          mkdir -p evidence
          lscpu > evidence/cpu.txt
          git rev-parse HEAD > evidence/commit.txt
          make -C prog1_mandelbrot_threads
          cd prog1_mandelbrot_threads
          for policy in block cyclic; do
            for view in 1 2; do
              for threads in 1 2 3 4 5 6 7 8 16 32; do
                MANDELBROT_POLICY=$policy MANDELBROT_TIMING=1 ./mandelbrot --view $view --threads $threads > ../evidence/$policy-v$view-t$threads.txt
                cmp mandelbrot-serial.ppm mandelbrot-thread.ppm
              done
            done
          done
      - name: Independent small dimensions under sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -Icommon tests/prog1_boundaries.cpp prog1_mandelbrot_threads/mandelbrotSerial.cpp prog1_mandelbrot_threads/mandelbrotThread.cpp -o /tmp/prog1-boundaries
          /tmp/prog1-boundaries | tee evidence/boundaries.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prog1-results
          path: evidence/
